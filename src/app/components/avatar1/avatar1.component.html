<div class="container">
    <h1>Avatar</h1>
    <div>
        <h3>Ingresa el nombre para la carita ajkdsa</h3>
        <input type="text" #nombreInput>
        <button (click)="cambiarNombre(nombreInput.value)">Guardar</button>
    </div>
    <div class="canvas-avatar">
        <div class="cuerpo"
        [class.girando]="girando()"
        [class.girando2]="girando2()"
        [style.background-color]="colorFondo()"
        [style.width.px]="tamano()"
        [style.height.px]="tamano()"
        >
        <div class = "ojos">
            <div class="ojo"></div>
            <div class="ojo"></div>
            @if (tieneLentes()) {
                <div class="lentes"></div>
            }
        </div>
        <div class="boca">
            @switch (tipoExpresion()) {
                @case (1) { <div class="feliz"></div>}
                @case (2) { <div class="sorprendido"></div>}
                @case (3) { <div class="serio"></div>}
            }
        </div>            
        </div>
        
    </div>
    
    <h1 [style.color]="colorFondo()">{{ nombre() }}</h1>


    <div class="controles">
        <label > Color </label>
        <input type="color" [value]="colorFondo()" (input)="cambiarColor($event)">
        <label > Tamaño </label>
        <input type="range" min="50" max="200" [value]="tamano()" (input)="cambiarTamano($event)">
        <label > Lentes </label>
        <button (click)="toggleLentes($event)">
            {{ tieneLentes() ? 'Quitar Lentes' : 'Poner Lentes' }} (Booleano)
        </button>
        <label > Expresion</label>
        <button (click)="cambiarExpresion(1)">Feliz</button>
        <button (click)="cambiarExpresion(2)">Sorprendido</button>
        <button (click)="cambiarExpresion(3)">Serio</button>
        <label>Girar</label>
        <button (click)="toggleGirar($event)">{{girando() ? 'Detener' : 'Girar'}}</button>
        <button (click)="toggleGirar2($event)">{{girando2() ? 'Detener' : 'Girar EJE X'}}</button>
    </div>
</div>
